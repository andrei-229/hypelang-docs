<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HypeLang IDE</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <div id="app">

    <!-- ── Header ─────────────────────────────────────────────── -->
    <header id="header">
      <div class="header-brand">
        <img src="/logo.svg" alt="HypeLang">
        <span class="brand-name">HypeLang IDE</span>
      </div>

      <div class="header-tabs" id="tabs"></div>

      <div class="header-actions">
        <button class="btn" id="btn-new" title="New File (Ctrl+N)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 1H3a1 1 0 00-1 1v12a1 1 0 001 1h10a1 1 0 001-1V6L9 1z" />
            <polyline points="9,1 9,6 14,6" />
            <line x1="8" y1="9" x2="8" y2="13" />
            <line x1="6" y1="11" x2="10" y2="11" />
          </svg>
          New
        </button>
        <button class="btn" id="btn-open" title="Open File (Ctrl+O)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path
              d="M1 3.5A1.5 1.5 0 012.5 2h2.764c.958 0 1.76.56 2.12 1.37L7.5 4H14a1 1 0 011 1v7a1.5 1.5 0 01-1.5 1.5h-11A1.5 1.5 0 011 12V3.5z" />
          </svg>
          Open
        </button>
        <button class="btn btn-primary" id="btn-save" title="Save (Ctrl+S)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2 2h9l3 3v9a1 1 0 01-1 1H2a1 1 0 01-1-1V3a1 1 0 011-1z" />
            <rect x="4" y="9" width="8" height="5" rx="0.5" />
            <rect x="5" y="2" width="5" height="4" rx="0.5" />
          </svg>
          Save
        </button>
        <button class="btn" id="btn-save-as" title="Save As">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M8 1v8M5 6l3 3 3-3M2 11v2a1 1 0 001 1h10a1 1 0 001-1v-2" />
          </svg>
          Save As
        </button>

        <input type="file" id="file-input" accept=".hypelang,.hype,.hpl" style="display:none">
      </div>
    </header>

    <!-- ── Main ───────────────────────────────────────────────── -->
    <div id="main">

      <!-- Sidebar -->
      <aside id="sidebar">
        <div class="sidebar-header">
          <span>Explorer</span>
          <button class="icon-btn" id="btn-new-file" title="New File">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14">
              <path d="M9 1H3a1 1 0 00-1 1v12a1 1 0 001 1h10a1 1 0 001-1V6L9 1z" />
              <polyline points="9,1 9,6 14,6" />
              <line x1="8" y1="9" x2="8" y2="13" />
              <line x1="6" y1="11" x2="10" y2="11" />
            </svg>
          </button>
        </div>
        <div class="sidebar-tree" id="file-tree"></div>

        <div class="sidebar-section">
          <div class="sidebar-header">Examples</div>
          <div class="sidebar-examples" id="examples-list"></div>
        </div>
      </aside>

      <!-- Editor + Output -->
      <div class="editor-wrap">
        <div id="editor-placeholder">
          <img src="/logo.svg" class="placeholder-logo" alt="">
          <div class="placeholder-title">Welcome to HypeLang IDE</div>
          <p class="placeholder-sub">Open a file or start a new one</p>
          <div class="placeholder-actions">
            <button class="btn btn-primary" id="btn-welcome-new">New File</button>
            <button class="btn" id="btn-welcome-open">Open File</button>
          </div>
          <div class="drop-hint" id="drop-hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M16 10l-4 4-4-4M12 14V4" />
            </svg>
            <span>Drop .hypelang / .hype / .hpl here</span>
          </div>
          <div class="welcome-grid" id="welcome-grid"></div>
        </div>
        <div id="monaco-editor"></div>

      </div>

      <!-- Docs Panel -->
      <aside id="docs-panel" class="hidden">
        <div class="docs-header">
          <span id="docs-title">Reference</span>
          <div class="lang-toggle">
            <button class="lang-btn active" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="ru">RU</button>
          </div>
          <button class="icon-btn" id="btn-close-docs" title="Close">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="12" height="12">
              <line x1="2" y1="2" x2="14" y2="14" />
              <line x1="14" y1="2" x2="2" y2="14" />
            </svg>
          </button>
        </div>
        <div class="docs-search">
          <input type="search" id="docs-search" placeholder="Search…" data-placeholder-en="Search functions…"
            data-placeholder-ru="Поиск функций…">
        </div>
        <div class="docs-scroll" id="docs-scroll"></div>
      </aside>

    </div>

    <!-- ── Status Bar ──────────────────────────────────────────── -->
    <footer id="statusbar">
      <div class="status-left">
        <span class="status-tag">
          <svg viewBox="0 0 16 16" fill="currentColor" width="11" height="11">
            <path d="M5 3a1 1 0 011-1h4a1 1 0 011 1v1h2a1 1 0 011 1v8a1 1 0 01-1 1H3a1 1 0 01-1-1V5a1 1 0 011-1h2V3z" />
          </svg>
          HypeLang
        </span>
        <span class="status-sep">|</span>
        <span id="status-file">No file</span>
      </div>
      <div class="status-right">
        <span id="status-pos">Ln 1, Col 1</span>
        <span class="status-sep">|</span>
        <button class="status-btn" id="btn-toggle-docs">Docs</button>
        <button class="status-btn" id="btn-open-guide">Guide</button>
        <button class="status-btn" id="btn-toggle-sidebar">Explorer</button>
      </div>
    </footer>

  </div>

  <!-- ── Guide Overlay ──────────────────────────────────────── -->
  <div id="guide-overlay" class="hidden">
    <div id="guide-panel">
      <div id="guide-header">
        <div class="guide-brand">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
            <path
              d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.69 0 3.254.586 4.5 1.558V4.804z" />
            <path
              d="M11 4.804A7.967 7.967 0 0114.5 4c1.255 0 2.443.29 3.5.804v10a7.969 7.969 0 00-3.5-.804c-1.69 0-3.254.586-4.5 1.558V4.804z" />
          </svg>
          <span id="guide-title-text">HypeLang Guide</span>
        </div>
        <div class="guide-header-center">
          <div class="lang-toggle">
            <button class="lang-btn" data-lang="en" id="guide-lang-en">EN</button>
            <button class="lang-btn" data-lang="ru" id="guide-lang-ru">RU</button>
          </div>
        </div>
        <button class="icon-btn" id="btn-close-guide" title="Close Guide">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14">
            <line x1="2" y1="2" x2="14" y2="14" />
            <line x1="14" y1="2" x2="2" y2="14" />
          </svg>
        </button>
      </div>

      <div id="guide-body">
        <nav id="guide-nav">
          <div id="guide-nav-list"></div>
        </nav>
        <main id="guide-content">
          <div id="guide-content-inner"></div>
        </main>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast"></div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
